name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Python deps
        run: python3 -m pip install --quiet pillow
      - name: Make gradlew executable
        run: chmod +x android-app/android/gradlew
      - name: Build debug APK
        working-directory: android-app
        run: ./android/gradlew -p android :app:assembleDebug -PpetPython=python3 --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pet-apk
          path: android-app/android/app/build/outputs/apk/debug/*.apk
